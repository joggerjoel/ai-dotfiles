# order|name|os|install_fn|guard
# os:         darwin | linux | both
# install_fn: function in setup.sh, or "-" for config-only modules
# guard:      shell test that must succeed for the module to load. "-" means
#             always. LAST on purpose: with IFS='|', read assigns the whole
#             remainder to the final field, so a guard may itself contain "|"
#             or "||". Putting guard third shredded the pyenv row into the
#             wrong fields, which only surfaced on a Linux box where the
#             truncated guard was false.
#
# order is the single source of truth for load order — filenames under
# modules/ carry no numeric prefix, so re-sequencing means editing this
# table only, never renaming files.
10|zinit|both|ensure_zinit|-
20|omz|both|ensure_omz|-
30|p10k|both|ensure_p10k|-
40|plugins|both|ensure_omz_plugins|-
50|pyenv|both|-|command -v pyenv >/dev/null 2>&1 || [ -x "$HOME/.pyenv/bin/pyenv" ]
60|nvm|both|-|[ -s "$HOME/.nvm/nvm.sh" ]
70|bun|both|-|[ -s "$HOME/.bun/_bun" ]
80|uv|both|-|[ -s "$HOME/.local/bin/env" ]
90|completions|both|-|-
95|macos|darwin|-|-
99|local|both|-|[ -f "$HOME/.zshrc.local" ]
