# order|name|guard|os|install_fn
# guard: shell test that must succeed for the module to load. "-" means always.
# os:    darwin | linux | both
# install_fn: function in setup.sh, or "-" for config-only modules
#
# order is the single source of truth for load order — filenames under
# modules/ carry no numeric prefix, so re-sequencing means editing this
# table only, never renaming files.
10|zinit|-|both|ensure_zinit
20|omz|-|both|ensure_omz
30|p10k|-|both|ensure_p10k
40|plugins|-|both|-
50|pyenv|command -v pyenv >/dev/null 2>&1 || [ -x "$HOME/.pyenv/bin/pyenv" ]|both|-
60|nvm|[ -s "$HOME/.nvm/nvm.sh" ]|both|-
70|bun|[ -s "$HOME/.bun/_bun" ]|both|-
80|uv|[ -s "$HOME/.local/bin/env" ]|both|-
90|completions|-|both|-
95|macos|-|darwin|-
99|local|[ -f "$HOME/.zshrc.local" ]|both|-
