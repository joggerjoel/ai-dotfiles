# herdr layout — which spaces exist and which tabs each one holds.
#
# Copy to ~/.config/herdr/layout.conf and edit, then:
#   scripts/herdr-layout.sh status     # compare config against the live session
#   scripts/herdr-layout.sh apply      # create whatever is missing
#   scripts/herdr-layout.sh apply --wire   # ...and launch each tab's program
#
# It lives outside the repo because host names are private and this repo is
# public — same reason ansible-ai/inventory.local.yml is gitignored.
#
# Format
#   TABS=a,b,c              default tab list for every space declared below
#   <label> <host|local>    one space; host is an ssh alias, or `local` for
#                           the machine running herdr
#   <label> <host> a,b,c    ...with a tab list just for this space
#
# A tab's label is also the program herdr-wire-space.sh runs in it, so keep the
# labels to real command names. `cursor` is aliased to `agent` (cursor-agent).
# Tabs are created in the order listed.

TABS=claude,codex,cursor,pi,tmux

# The always-on node — herdr itself runs here, so no ssh hop.
node        local

# Workers, reached over ssh. The host column must match a Host entry in
# ~/.ssh/config; these names are placeholders, not real machines.
worker1     worker1
worker2     worker2

# A space with its own tab list, for a box that only runs one agent.
# gateway   gateway   claude,tmux
