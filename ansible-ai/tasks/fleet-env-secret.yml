---
# Distribute ONE control-node secret to the fleet as an environment variable.
#
# Extracted from deploy-claude-token.yml when a second value (FIRECRAWL_API_KEY)
# needed the identical machinery. Every host ends up with ONE file,
# ~/.config/claude-fleet/env, holding one `export VAR=value` line per variable,
# and ONE rc stanza sourcing it. A second copy of the playbook would have meant
# a second file and a second stanza for no reason.
#
# Parameters:
#   secret_var        required. The environment variable name. Also the key
#                     looked up in the control node's ~/.claude/.env.
#   secret_probe      required. A shell command that exits non-zero when the
#                     value is bad. Run on the CONTROL NODE with the candidate
#                     value in the environment, before anything is written.
#   secret_optional   default false. When true, a missing value ends the play
#                     quietly instead of failing it.
#   secret_hint       text for the failure or skip message: where to get the value.
#   secret_done_hint  optional. Appended to the success message, for a per-variable
#                     "now check it with ..." pointer.
#
# Facts are prefixed fleet_secret_* and every include re-sets all of them, so two
# includes in one play cannot read each other's values.
#
# Nothing here ever prints the value: every task that touches it sets no_log.
- name: Resolve where the fleet env file lives on this host
  ansible.builtin.set_fact:
    fleet_secret_dir: "{{ ansible_facts.env.HOME }}/.config/claude-fleet"
    fleet_secret_file: "{{ ansible_facts.env.HOME }}/.config/claude-fleet/env"
    # bash -lc (the herdr pane shape) reaches ~/.bashrc on Linux through
    # ~/.profile, but a bash LOGIN shell on macOS reads ~/.bash_profile — and a
    # Mac has no ~/.bashrc at all, which this play used to require outright
    # (macstudio: "Path .bashrc does not exist"). No interactive guard there,
    # so blockinfile appends at the end, which a login shell still reaches.
    fleet_secret_rc: "{{ ansible_facts.env.HOME }}/{{ '.bash_profile' if ansible_facts.os_family == 'Darwin' else '.bashrc' }}"

# Read from the control node's ~/.claude/.env by name. An explicitly exported
# variable of the same name wins, so a one-off run can override the file without
# editing it.
- name: Resolve the value on the control node
  ansible.builtin.set_fact:
    fleet_secret_value: >-
      {{ lookup('env', secret_var) | default('', true) | trim
         if (lookup('env', secret_var) | default('', true) | trim | length > 0)
         else ((lookup('file', lookup('env', 'HOME') ~ '/.claude/.env', errors='ignore') | default('', true))
               | regex_findall('(?m)^[ \t]*(?:export[ \t]+)?' ~ secret_var ~ '[ \t]*=[ \t]*["\x27]?([^"\x27\r\n]+)')
               | first | default('', true) | trim) }}
  no_log: true

- name: Say why an optional value is being skipped
  ansible.builtin.debug:
    msg: >-
      No {{ secret_var }} on the control node, so distribution is skipped.
      To enable it: {{ secret_hint | default('add it to ~/.claude/.env') }}
  run_once: true
  when:
    - secret_optional | default(false) | bool
    - fleet_secret_value | length == 0

- name: Stop cleanly when an optional value is absent
  ansible.builtin.meta: end_play
  when:
    - secret_optional | default(false) | bool
    - fleet_secret_value | length == 0

# Fail loudly and early rather than writing an empty export that would look
# installed and authenticate nothing.
- name: Require the value on the control node
  ansible.builtin.assert:
    that:
      - fleet_secret_value | length > 0
    fail_msg: >-
      No {{ secret_var }} found. {{ secret_hint | default('Add it to ~/.claude/.env as ' ~ secret_var ~ '=<value>.') }}
    success_msg: "{{ secret_var }} found on the control node"
  run_once: true
  # The assert message would otherwise echo the var it tested.
  no_log: true
  when: not (secret_optional | default(false) | bool)

# An exported value OVERRIDES a stored credential — verified on aorus8, where a
# host that answers `ok` normally returns `401 OAuth access token is invalid`
# with a bogus token in the env. That is what makes distribution work, and it is
# also the danger: a revoked or mistyped value does not merely fail to help, it
# breaks every host it reaches, including hosts that were perfectly healthy
# beforehand.
#
# So prove the value works ON THE CONTROL NODE before writing it anywhere.
# Setting it in the environment here tests the value itself rather than this
# machine's own login, for exactly the precedence reason above. A hash-only
# check cannot catch this: a revoked credential installs and verifies perfectly
# and authenticates nothing.
- name: Prove the value actually works before distributing it
  ansible.builtin.shell:
    # Quoted: a `: ` inside a probe prompt otherwise parses as a YAML mapping.
    cmd: "{{ secret_probe }}"
  environment: "{{ {secret_var: fleet_secret_value} }}"
  delegate_to: localhost
  run_once: true
  register: fleet_secret_liveness
  changed_when: false
  failed_when: fleet_secret_liveness.rc != 0
  no_log: true
  check_mode: false

- name: Say that the value is live
  ansible.builtin.debug:
    msg: >-
      {{ secret_var }} verified against its service — safe to distribute. (If
      this had failed, nothing would have been written: a bad value would break
      every host it reached, including healthy ones.)
  run_once: true

- name: Ensure the fleet env directory exists
  ansible.builtin.file:
    path: "{{ fleet_secret_dir }}"
    state: directory
    mode: "0700"

# 0600, in its own file, deliberately NOT appended to .bashrc: .bashrc is mode
# 644 on these hosts (verified), so a long-lived credential written there would
# be readable by every user on the box.
#
# lineinfile, not copy: several variables share this one file, and copy would
# make each include erase the ones written before it.
- name: Write the export line (0600)
  ansible.builtin.lineinfile:
    path: "{{ fleet_secret_file }}"
    regexp: '^export {{ secret_var }}='
    line: "export {{ secret_var }}={{ fleet_secret_value }}"
    create: true
    mode: "0600"
  no_log: true

# Placement is load-bearing. herdr wires remote panes as
#   ssh -t HOST 'bash -lc "claude; exec $SHELL -l"'
# which is a LOGIN but NON-INTERACTIVE shell. It reaches ~/.bashrc through
# ~/.profile, and stock Ubuntu ~/.bashrc returns immediately for
# non-interactive shells:
#
#     case $- in *i*) ;; *) return;; esac
#
# So anything appended to the BOTTOM is never seen by a pane, while still being
# visible to an interactive ssh — it would look installed and do nothing.
# Verified on aorus8: TEAM_DIR (defined below the guard) reads empty under
# `bash -lc` and `bulls` under `bash -ic`. insertbefore puts the stanza above
# the guard, where nvm already sits for exactly this reason.
#
# One stanza covers every variable in the file. The marker is historical (it
# predates the second variable) and must not change: renaming it would leave the
# old block in place and source the file twice.
- name: Source the fleet env from the login rc, above any interactive guard
  ansible.builtin.blockinfile:
    path: "{{ fleet_secret_rc }}"
    marker: "# {mark} ANSIBLE MANAGED — claude fleet token"
    insertbefore: "^# If not running interactively"
    block: |
      # Login-but-non-interactive shells (herdr panes: bash -lc) must reach
      # this, so it lives above the interactive guard below.
      [ -r "$HOME/.config/claude-fleet/env" ] && . "$HOME/.config/claude-fleet/env"
    create: false

# The real check: not "did the file land" but "does a pane-shaped shell see it".
# Compares against the control node's value without printing either.
#
# The NAME travels through the environment and is dereferenced with bash's
# indirect expansion. Spelling ${VAR} with a templated VAR would put `{{` right
# after `${`, and Jinja would eat the opening brace.
#
# Skipped under --check, and deliberately NOT `check_mode: false`. An earlier
# version ran it in check mode against a host where nothing had been written; it
# dutifully reported `ok`, the assert below skipped, and a dry run came out
# looking exactly like a successful deploy — three `changed:` lines, a diff, and
# no failures. Verification that runs when there is nothing to verify is worse
# than no verification.
- name: Verify a pane-shaped shell resolves the value
  ansible.builtin.shell:
    cmd: bash -lc 'printf "%s" "${!FLEET_ENV_VAR_NAME:-}" | sha256sum | cut -c1-12'
  environment:
    FLEET_ENV_VAR_NAME: "{{ secret_var }}"
  register: fleet_secret_check
  changed_when: false
  when: not ansible_check_mode

- name: Fail if the pane-shaped shell resolved nothing or the wrong value
  ansible.builtin.assert:
    that:
      - fleet_secret_check.stdout == (fleet_secret_value | hash('sha256'))[0:12]
    fail_msg: >-
      {{ inventory_hostname }}: `bash -lc` did not resolve the expected
      {{ secret_var }}. Check that the source stanza landed ABOVE the
      `case $- in *i*)` guard in {{ fleet_secret_rc }} — below it, a login
      non-interactive shell never reaches it.
    success_msg: "{{ inventory_hostname }}: pane-shaped shell resolves {{ secret_var }}"
  when: not ansible_check_mode

# Says which of the two things just happened. The previous wording claimed
# "distributed" in both cases.
- name: What happened, and what to check next
  ansible.builtin.debug:
    msg: >-
      {{
        'DRY RUN — nothing was written and nothing was verified. Re-run without --check to deploy.'
        if ansible_check_mode else
        (secret_var ~ ' distributed and verified in a pane-shaped shell. ' ~ (secret_done_hint | default('', true)))
      }}
  run_once: true
