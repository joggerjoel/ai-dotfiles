---
# Desired state for the fleet observability stack. This file is the only place
# a version is written down. The deploy playbook, scripts/observability.sh,
# update.sh, and scripts/observability.test.sh all read it, so bumping a
# version here is the whole change.
#
# What consumes what:
#   node_exporter  every host in aorus_ai + local_ai
#   dashboards     provisioned into the `infra` provider on the Grafana host
#   stack          containers on the observability_ai host only
#
# Scrape targets are deliberately absent. They are generated from the ansible
# inventory (see templates/prometheus.yml.j2), because a hand-written host list
# is the drift lib/fleet.sh exists to prevent, and the list this replaces had
# already gone stale by omitting both macs.

# Checked against github.com/prometheus/node_exporter releases on 2026-09-01.
# The fleet sat on 1.10.2 until this landed.
node_exporter:
  version: "1.12.1"
  listen_address: ":9100"
  # node_exporter ships no collector for listening sockets. node_netstat_* and
  # node_sockstat_* are aggregate counters, so a stock install cannot answer
  # "what is bound to 3002 on this host". Nothing on grafana.com fixes that
  # either, because the metric does not exist to build a dashboard on: a search
  # for listening-port dashboards returns zero results.
  #
  # The textfile collector is compiled in and on by default, but its directory
  # defaults to empty, which is why the fleet's current units read simply
  # `ExecStart=/usr/local/bin/node_exporter` and publish nothing. Setting the
  # directory is the whole change.
  textfile_dir: /var/lib/node_exporter/textfile_collector
  textfile_collectors:
    # Reads from inside the host, so it gets the process name and costs no port
    # scan on the LAN. The alternative, prometheus-net-discovery, scans from
    # outside: no process names, and a recurring nmap sweep of your own network.
    #
    # Runs as root. `ss -p` only names processes the caller owns, so an
    # unprivileged run reports proc="unknown" for everything else, which looks
    # like data rather than like a permissions problem.
    - name: listening_ports
      script: scripts/node-listening-ports.sh
      interval: 5m
      user: root
  # Both platforms install the checksum-verified release tarball, Linux under a
  # systemd unit and macOS under a launchd daemon. deploy-observability.yml
  # records why homebrew was rejected for the mac.

# Pinned by revision, not "latest". A dashboard changes when someone bumps a
# revision in this file and not when grafana.com publishes one.
# Revision 45 was current on 2026-09-01.
# Infrastructure exporters, one entry per service role.
#
# Placement is an inventory group, exactly like observability_ai. A host runs
# redis, so it joins redis_ai, so prometheus scrapes it and the dashboard fills
# in. There is no second list.
#
# `present: true` means the exporter is already installed and the only missing
# piece was a scrape job. That was the case for three of these four: the
# exporters have been up and answering while prometheus never asked.
#
# Measured from aorus7 on 2026-09-01, which is the host that would do the
# scraping:
#   aorus  :9121 redis     http 200, scraped, redis_up 1
#   aorus2 :9121 redis     http 200, NOT scraped
#   aorus4 :9121 redis     http 200, NOT scraped
#   aorus  :9104 mysql     http 200, scraped, but mysql_up 0
#   aorus  :15692 rabbitmq http 200, NO scrape job at all
#   aorus4 :9187 postgres  no listener, exporter does not exist
# `detect` drives `observability.sh discover`, which reads the
# node_listening_port metric off each host and proposes group membership from
# what is actually bound. Introspection rather than a prompt: asking a human
# which hosts run redis is how the answer goes stale, and this fleet had two
# redis exporters running unnoticed.
#
#   service  the port the service itself listens on. Evidence the host has a
#            role at all, whether or not anything is exporting it.
#   exporter the port prometheus would scrape. Its absence next to a present
#            service port is the actionable finding: a role with no exporter.
exporters:
  redis:
    group: redis_ai
    job: redis
    port: 9121
    present: true
    detect: { service: 6379, exporter: 9121 }
    dashboard: { gnet_id: 763, revision: 6 }
  mysql:
    group: mysql_ai
    job: mysql
    port: 9104
    present: true
    detect: { service: 3306, exporter: 9104 }
    dashboard: { gnet_id: 7362, revision: 5 }
  # RabbitMQ needs no separate exporter. 15692 is the built-in
  # rabbitmq_prometheus plugin, already enabled and already answering.
  rabbitmq:
    group: rabbitmq_ai
    job: rabbitmq
    port: 15692
    present: true
    detect: { service: 5672, exporter: 15692 }
    dashboard: { gnet_id: 10991, revision: 15 }
  # The only one that has to be installed rather than merely scraped.
  #
  # Dashboard 9628 rather than 24298. 24298 queries pg_exporter_build_info and
  # pg_exporter_collector_*, which are internals of Vonng's pg_exporter, a
  # different program from the prometheus-community postgres_exporter. Pointing
  # 24298 at postgres_exporter leaves most of it blank. 9628 uses only metrics
  # postgres_exporter actually emits and has 12.7M downloads against 3k.
  #
  # aorus4 runs three separate databases: supabase-db (15.8.1),
  # pinmap-supabase-db (17.6.1) and realtime-ivr-db (postgres:16). One exporter
  # per database, so this needs three targets and three sets of credentials,
  # not one.
  postgres:
    group: postgres_ai
    job: postgres
    port: 9187
    present: false
    detect: { service: 5432, exporter: 9187 }
    dashboard: { gnet_id: 9628, revision: 8 }

dashboards:
  # 1860 is a Linux dashboard. It is still the right one for the fleet, but
  # expect it to be partly blank for macstudio and macair rather than treating
  # that as a broken exporter.
  #
  # The darwin build simply exposes less, because there is no /proc. Measured
  # 2026-09-01 on node_exporter 1.12.1: 99 metric families on macstudio against
  # 328 on aorus7. CPU, load, filesystem, network and disk panels all work.
  #
  # Memory panels do not, and cannot be made to. 1860 queries 45 distinct
  # node_memory_* series and every one is a capitalised Linux /proc/meminfo
  # name (MemTotal_bytes, MemAvailable_bytes, Cached_bytes). Darwin publishes
  # twelve lowercase names instead (node_memory_total_bytes,
  # node_memory_active_bytes, node_memory_wired_bytes, node_memory_compressed_bytes).
  # The two sets do not intersect at all, so there is no relabel or recording
  # rule that fixes this. Proper mac memory panels need a small hand-authored
  # dashboard on the darwin names. See the open items in the design spec.
  - name: node-exporter-full
    gnet_id: 1860
    revision: 45
    folder: Fleet
    datasource: prometheus
  # Hand authored, because no published dashboard covers this. A grafana.com
  # search for "listening ports" returns nothing, and the closest hit, 23614
  # "Prometheus Net Discovery", needs a network scanner rather than this metric.
  # Dashboard 14788 "Port General" is a different meaning of the word entirely:
  # SNMP switch-interface bandwidth, read out of InfluxDB.
  #
  # The panel that pays for this is a table of node_listening_port grouped by
  # port and host. Before binding anything, node_listening_port{port="3002"}
  # lists every host already using it.
  - name: fleet-listening-ports
    file: dashboards/fleet-listening-ports.json
    folder: Fleet
    datasource: prometheus

# Images are pinned to what aorus7 already runs, so taking ownership of the
# stack does not also upgrade it. Version bumps are a separate, reviewable
# change.
#
# Ports: 3000 belongs to an unrelated node process on aorus7, which is why
# grafana has always been on 3002. Keeping 3002 preserves existing bookmarks.
# Only grafana needs to leave the host.
# Volumes are ours, not recon's, and that is the whole point.
#
# Recon's compose declares its volumes bare (`prometheus_data:` with no
# `external: true`), which makes them project-owned. A `docker compose down -v`
# in that repo deletes them, and no wording in OUR compose file can prevent it.
# Reusing them would have left every fleet metric and dashboard one routine
# command in another repository away from deletion.
#
# So the stack runs on obs_* volumes that belong to no compose project. They are
# declared external here as well, so our own `down -v` cannot take them either;
# the playbook creates them with `docker volume create`, which is idempotent.
#
# The migration copies data across rather than moving it, and the untouched
# recon-monitoring_* volumes are then the rollback. That is a real byte-for-byte
# copy still attached to recon's compose, which is stronger than the snapshot
# step an earlier draft described. Total is about 92 MB, so the copy costs
# seconds.
# The stubhub-recon-gui project is defunct, which removes most of what made an
# earlier version of this file complicated. There is no ownership split to
# maintain, no read-only mounts into another repo's working tree, and no shared
# network: recon-network was verified to hold only the four monitoring
# containers this stack replaces, so it is replaced by our own.
#
# Only prometheus carries data worth keeping. Its volume holds fleet
# node_exporter history, so it is copied. Grafana deliberately starts FRESH:
# the inherited volume carries admin/admin, anonymous access, dead dashboards
# for a dead project, and API keys nobody can enumerate. Starting clean is the
# fix for that, not a cost of it. Loki and promtail held 1.3 MB of a defunct
# project's logs.
stack:
  dir: /opt/observability
  network: obs-network
  # Images carry both a tag and a digest. The tag is for humans, the digest is
  # what docker resolves. A tag can be repointed on the registry without this
  # file changing, which is the same silent drift this design treats as a bug
  # everywhere else. Digests were read from the registry on 2026-09-01; the loki
  # and promtail ones match the images aorus7 already runs.
  #
  # Note that recon runs grafana and prometheus from `:latest`, so pinning those
  # two pulls a different image object than the one running now, even though the
  # version numbers match. Loki and promtail are byte-identical to what is live.
  #
  # mem_limit bounds a runaway, it is not a capacity plan. Measured usage on
  # aorus7 is grafana 133M, prometheus 81M, loki 73M, promtail 40M, about 328M
  # combined on a host with 187G of RAM and 98G free. The limits below are
  # roughly ten times observed, so they never bind in normal running and still
  # cap a cardinality explosion. No cpu limits: 32 cores sit near idle for these
  # services, and a cpu cap adds latency without preventing any failure seen
  # here.
  grafana:
    image: "grafana/grafana:12.3.3"
    digest: "sha256:9e1e77ade304069aee3196e9a4f210830e96e80ce9a2640891eccc324b152faf"
    port: 3002
    bind: "0.0.0.0"
    volume: obs_grafana_data
    mem_limit: 1g
  prometheus:
    image: "prom/prometheus:v3.9.1"
    digest: "sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702"
    port: 9090
    bind: "127.0.0.1"
    volume: obs_prometheus_data
    migrate_from: recon-monitoring_prometheus_data
    mem_limit: 4g
  loki:
    image: "grafana/loki:3.6.0"
    digest: "sha256:6a705de65df88aa0d90a44779606b0042722c86637335a73858f65f9fe9f9557"
    port: 3100
    bind: "127.0.0.1"
    volume: obs_loki_data
    mem_limit: 2g
  promtail:
    image: "grafana/promtail:3.6.0"
    digest: "sha256:2aafa34b3d5fba888c51081d3a22c234906ffd3cafc5def11c581549b297d449"
    volume: obs_promtail_data
    mem_limit: 512m

# A docker volume on the local driver has no size of its own. It is a directory
# on /var/lib/docker, so it grows until the filesystem is full and there is no
# quota to set. Retention IS the volume sizing mechanism, which is why these
# numbers live here rather than a `size:` key that docker would ignore.
#
# Measured on aorus7 on 2026-09-01: prometheus carries 20138 active series at
# 1115 samples/sec. At roughly 2 bytes per compressed sample that is ~193 MB a
# day, and the three hosts this design adds take it to about 215 MB a day.
# 90 days is therefore ~19 GB against 788 GB free.
#
# Both a time and a size bound are set on purpose. Time alone does not protect
# against a cardinality explosion, where one bad label multiplies series and
# fills the disk well inside the retention window. Whichever bound is hit first
# wins.
#
# Loki currently has no retention configured at all, so logs grow forever. It
# holds 1.3 MB today because only aorus7 ships logs. Shipping fleet wide would
# multiply that, so its window is shorter than the metrics one: logs are bulky
# per unit of insight and are mostly read within days, while metrics are what
# you go back a quarter to compare against.
retention:
  prometheus:
    time: 90d
    size: 25GB
  loki:
    period: 30d
    # Loki only enforces retention when the compactor is told to, and it is off
    # by default. Setting the period without these two does nothing at all.
    compactor_retention_enabled: true
    delete_request_store: filesystem
