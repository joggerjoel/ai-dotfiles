---
# Desired state for the fleet observability stack. This file is the only place
# a version is written down. The deploy playbook, scripts/observability.sh,
# update.sh, and scripts/observability.test.sh all read it, so bumping a
# version here is the whole change.
#
# What consumes what:
#   node_exporter  every host in aorus_ai + local_ai
#   dashboards     provisioned into the `infra` provider on the Grafana host
#   stack          containers on the observability_ai host only
#
# Scrape targets are deliberately absent. They are generated from the ansible
# inventory (see templates/prometheus.yml.j2), because a hand-written host list
# is the drift lib/fleet.sh exists to prevent, and the list this replaces had
# already gone stale by omitting both macs.

# Checked against github.com/prometheus/node_exporter releases on 2026-09-01.
# The fleet sat on 1.10.2 until this landed.
node_exporter:
  version: "1.12.1"
  listen_address: ":9100"
  # Linux installs the release tarball under a systemd unit. macOS uses
  # homebrew, whose formula can lag upstream; the reconciler reports the gap
  # rather than failing, since brew will not install an arbitrary version.
  macos_method: homebrew

# Pinned by revision, not "latest". A dashboard changes when someone bumps a
# revision in this file and not when grafana.com publishes one.
# Revision 45 was current on 2026-09-01.
dashboards:
  - name: node-exporter-full
    gnet_id: 1860
    revision: 45
    folder: Fleet
    datasource: prometheus

# Images are pinned to what aorus7 already runs, so taking ownership of the
# stack does not also upgrade it. Version bumps are a separate, reviewable
# change.
#
# Ports: 3000 belongs to an unrelated node process on aorus7, which is why
# grafana has always been on 3002. Keeping 3002 preserves existing bookmarks.
# Only grafana needs to leave the host.
# Volumes are ours, not recon's, and that is the whole point.
#
# Recon's compose declares its volumes bare (`prometheus_data:` with no
# `external: true`), which makes them project-owned. A `docker compose down -v`
# in that repo deletes them, and no wording in OUR compose file can prevent it.
# Reusing them would have left every fleet metric and dashboard one routine
# command in another repository away from deletion.
#
# So the stack runs on obs_* volumes that belong to no compose project. They are
# declared external here as well, so our own `down -v` cannot take them either;
# the playbook creates them with `docker volume create`, which is idempotent.
#
# The migration copies data across rather than moving it, and the untouched
# recon-monitoring_* volumes are then the rollback. That is a real byte-for-byte
# copy still attached to recon's compose, which is stronger than the snapshot
# step an earlier draft described. Total is about 92 MB, so the copy costs
# seconds.
stack:
  dir: /opt/observability
  network: recon-network
  # Images carry both a tag and a digest. The tag is for humans, the digest is
  # what docker resolves. A tag can be repointed on the registry without this
  # file changing, which is the same silent drift this design treats as a bug
  # everywhere else. Digests were read from the registry on 2026-09-01; the loki
  # and promtail ones match the images aorus7 already runs.
  #
  # Note that recon runs grafana and prometheus from `:latest`, so pinning those
  # two pulls a different image object than the one running now, even though the
  # version numbers match. Loki and promtail are byte-identical to what is live.
  #
  # mem_limit bounds a runaway, it is not a capacity plan. Measured usage on
  # aorus7 is grafana 133M, prometheus 81M, loki 73M, promtail 40M, about 328M
  # combined on a host with 187G of RAM and 98G free. The limits below are
  # roughly ten times observed, so they never bind in normal running and still
  # cap a cardinality explosion. No cpu limits: 32 cores sit near idle for these
  # services, and a cpu cap adds latency without preventing any failure seen
  # here.
  grafana:
    image: "grafana/grafana:12.3.3"
    digest: "sha256:9e1e77ade304069aee3196e9a4f210830e96e80ce9a2640891eccc324b152faf"
    port: 3002
    bind: "0.0.0.0"
    volume: obs_grafana_data
    migrate_from: recon-monitoring_grafana_data
    mem_limit: 1g
  prometheus:
    image: "prom/prometheus:v3.9.1"
    digest: "sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702"
    port: 9090
    bind: "127.0.0.1"
    volume: obs_prometheus_data
    migrate_from: recon-monitoring_prometheus_data
    mem_limit: 4g
  loki:
    image: "grafana/loki:3.6.0"
    digest: "sha256:6a705de65df88aa0d90a44779606b0042722c86637335a73858f65f9fe9f9557"
    port: 3100
    bind: "127.0.0.1"
    volume: obs_loki_data
    migrate_from: recon-monitoring_loki_data
    mem_limit: 2g
  promtail:
    image: "grafana/promtail:3.6.0"
    digest: "sha256:2aafa34b3d5fba888c51081d3a22c234906ffd3cafc5def11c581549b297d449"
    volume: obs_promtail_data
    migrate_from: recon-monitoring_promtail_data
    mem_limit: 512m

# A docker volume on the local driver has no size of its own. It is a directory
# on /var/lib/docker, so it grows until the filesystem is full and there is no
# quota to set. Retention IS the volume sizing mechanism, which is why these
# numbers live here rather than a `size:` key that docker would ignore.
#
# Measured on aorus7 on 2026-09-01: prometheus carries 20138 active series at
# 1115 samples/sec. At roughly 2 bytes per compressed sample that is ~193 MB a
# day, and the three hosts this design adds take it to about 215 MB a day.
# 90 days is therefore ~19 GB against 788 GB free.
#
# Both a time and a size bound are set on purpose. Time alone does not protect
# against a cardinality explosion, where one bad label multiplies series and
# fills the disk well inside the retention window. Whichever bound is hit first
# wins.
#
# Loki currently has no retention configured at all, so logs grow forever. It
# holds 1.3 MB today because only aorus7 ships logs. Shipping fleet wide would
# multiply that, so its window is shorter than the metrics one: logs are bulky
# per unit of insight and are mostly read within days, while metrics are what
# you go back a quarter to compare against.
retention:
  prometheus:
    time: 90d
    size: 25GB
  loki:
    period: 30d
    # Loki only enforces retention when the compactor is told to, and it is off
    # by default. Setting the period without these two does nothing at all.
    compactor_retention_enabled: true
    delete_request_store: filesystem

# The stubhub-recon-gui repo owns these paths. ai-dotfiles reads them and never
# writes them: the dashboards mount read-only, and the scrape jobs are pulled in
# through prometheus `scrape_config_files`. Writing into another repo's working
# tree would let a git checkout there silently revert the fleet config.
foreign:
  # Absolute on purpose. Docker Compose does not expand `~` in a bind-mount
  # source, and a compose run as root would resolve a real `~` to /root. Either
  # way the mount silently resolves to an empty directory, and because every
  # recon provider sets `disableDeletion: false`, grafana's file provisioner
  # then deletes the 20 dashboards it had provisioned from the shared volume
  # this design promises will survive. Never write a `~` here.
  recon_monitoring_dir: "/home/joggerjoel/Developer/stubhub-recon-gui/monitoring"
  # Set on every foreign provider we render, so a mount that goes missing
  # degrades to stale dashboards instead of destroying them.
  disable_deletion: true
  dashboard_providers:
    - { name: Recon, folder: Recon, path: grafana/dashboards/json }
    - {
        name: Ticket Exchange,
        folder: Ticket Exchange,
        path: grafana/dashboards/json,
      }
