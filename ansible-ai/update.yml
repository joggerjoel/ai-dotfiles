---
# Fleet update, driven from the MacBook Pro (control node).
# For every reachable aorus host:
#   1. Upgrade the Claude Code binary   (native `claude update`)
#   2. Refresh ai-dotfiles config   (`setup.sh update`: git pull --rebase
#      --autostash, then re-apply the SAVED vps profile — fully unattended)
#   3. Upgrade the sibling agent CLIs   (scripts/agents-update.sh from the
#      freshly-pulled repo: codex, cursor-agent, cortex, opencode, gemini,
#      agy, pi, grok, kimi, headroom — plus a 9router gateway status line)
#   4. Update the 9router gateway   (imports deploy-9router.yml — aorus
#      hosts only; recreates containers only when the image changed.
#      Skip with --skip-tags 9router)
#   5. Refresh the native headroom proxy   (imports deploy-headroom-proxy.yml
#      — headroom_native_ai hosts only; restarts the systemd user unit when
#      the running proxy lags the upgraded CLI. Skip with --skip-tags headroom)
#   9. Verify every asset actually works   (imports check-fleet-preflight.yml —
#      runs scripts/preflight.sh per host: MCP servers, mandated CLIs, plugin
#      health, env vars, hooks, skills. Read-only, never quarantines, never
#      fails the run. Skip with --skip-tags preflight)
#
# Workflow: push changes to github.com/joggerjoel/ai-dotfiles, then run this
# to propagate them to the whole fleet.
#
# Read-only-safe to dry-run with --check. Offline hosts are skipped.
#
# Targets `ai_all` = the aorus servers + this Mac (the local control node, via
# ansible_connection: local). One run refreshes the whole picture. Limit with
# `--limit aorus_ai` (servers only) or `--limit local_ai` (this Mac only).
- name: Update the claude fleet (servers + local control node)
  hosts: ai_all
  gather_facts: true
  ignore_unreachable: true
  # Every other play here carries a tag, so this one had no way to be selected
  # on its own. `--tags sync` now runs the git pull and profile re-apply without
  # the CLI upgrades, the gateway deploys, or the token distribution — the last
  # of which asserts a token exists and fails the run when one does not.
  tags: [sync]
  tasks:
    # ignore_unreachable keeps one absent host from killing the run, but it also
    # marches unreachable hosts into the tasks below — where claude_bin templates
    # ansible_env.HOME, which never got gathered. That surfaced as
    # "'ansible_env' is undefined" and a recap reading `unreachable=0 failed=1`,
    # i.e. a dead host indistinguishable from a broken task. End the play for
    # those hosts here so the recap reports them as unreachable, which is true.
    # ignore_unreachable books an absent host as `ignored=1`, never as
    # `unreachable=1` — so the recap alone cannot tell you a host was skipped.
    # Say it out loud before ending the play, or it reads as a clean run.
    - name: Say plainly that a host was unreachable
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} UNREACHABLE — skipped entirely, nothing was updated here"
      when: ansible_facts == {}

    - name: Stop cleanly on hosts we could not reach
      ansible.builtin.meta: end_host
      when: ansible_facts == {}

    - name: Is the claude binary present?
      ansible.builtin.stat:
        path: "{{ claude_bin }}"
      register: claude_stat

    - name: Record current claude version
      ansible.builtin.command: "{{ claude_bin }} --version"
      register: ver_before
      changed_when: false
      failed_when: false
      when: claude_stat.stat.exists

    - name: Upgrade the Claude Code binary
      ansible.builtin.command: "{{ claude_bin }} update"
      register: bin_update
      changed_when: "'latest' not in (bin_update.stdout | lower)"
      failed_when: false
      when: claude_stat.stat.exists

    - name: Is ai-dotfiles present?
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/setup.sh"
      register: dotfiles_stat

    - name: Refresh ai-dotfiles config (git pull + re-apply saved profile)
      ansible.builtin.shell: bash setup.sh update
      args:
        chdir: "{{ dotfiles_dir }}"
        executable: /bin/bash
      register: dotfiles_update
      # setup.sh prints "pull-status: updated" only when HEAD actually moved,
      # and exits non-zero with a PULL-FAILED sentinel when the sync fails —
      # so a wedged host colors the recap red instead of claiming "refreshed".
      changed_when: "'pull-status: updated' in dotfiles_update.stdout"
      when: dotfiles_stat.stat.exists

    # Runs AFTER the repo refresh so the freshly-pulled script is used.
    # scripts/agents-update.sh is the single source of truth for the CLI
    # list — ./update.sh runs the same script locally.
    - name: Upgrade the sibling agent CLIs (codex, cursor, cortex, opencode, gemini, pi, grok, kimi, headroom, skillspector; reports 9router)
      ansible.builtin.command: bash scripts/agents-update.sh
      args:
        chdir: "{{ dotfiles_dir }}"
      environment:
        # Install missing CLIs unattended so the fleet roster converges —
        # otherwise hosts provisioned before a CLI was added never get it.
        AGENTS_AUTO_INSTALL: "1"
      register: agents_update
      changed_when: false
      failed_when: false
      when: dotfiles_stat.stat.exists

    - name: Record new claude version
      ansible.builtin.command: "{{ claude_bin }} --version"
      register: ver_after
      changed_when: false
      failed_when: false
      when: claude_stat.stat.exists

    - name: Report per-host result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ->
          claude: {{ ver_before.stdout | default('n/a', true) }}
          -> {{ ver_after.stdout | default('n/a', true) }} |
          dotfiles: {{ 'refreshed' if dotfiles_stat.stat.exists else 'not installed' }}

    # Always reports — an empty stdout with rc=127 (script missing after a
    # failed pull) used to vanish entirely from the recap.
    - name: Report sibling agent CLI results
      ansible.builtin.debug:
        msg: >-
          {{ agents_update.stdout_lines[1:] | map('trim') | list
             if (agents_update.stdout_lines | default([]) | length > 1)
             else ['agents-update.sh produced no report — rc=' ~ (agents_update.rc | default('n/a'))
                   ~ ' err: ' ~ (agents_update.stderr | default('') | trim | truncate(120))] }}
      when: agents_update is not skipped

# ── 4. 9router gateway (Docker on the aorus hosts) ───────────────
# deploy-9router.yml doubles as the update path: it re-pulls :latest and
# `docker compose up -d` recreates the containers ONLY when the image
# actually changed — a no-update run never restarts a gateway other CLIs
# may be streaming through. Secrets are preserved across re-runs.
# Skip entirely with:  ansible-playbook update.yml --skip-tags 9router
- import_playbook: deploy-9router.yml
  tags: [9router]

# ── 5. Native headroom proxy (systemd user unit, headroom_native_ai hosts) ──
# agents-update.sh upgrades the headroom CLI but never restarts a live proxy;
# this play restarts the unit only when /health shows the proxy lagging the
# CLI. Skip with:  ansible-playbook update.yml --skip-tags headroom
- import_playbook: deploy-headroom-proxy.yml
  tags: [headroom]

# ── 6. herdr terminal workspace manager (ai_all) ────────────────────────────
# Installs herdr where absent, and converges stale installs — but ONLY on hosts
# whose herdr server is idle, because `herdr update` stops the server and would
# kill live panes and any agent mid-task. A host with a running server is left
# alone and reported by name. Also keeps the control node from updating itself
# out from under a live session.
# Skip with:  ansible-playbook update.yml --skip-tags herdr
- import_playbook: provision-herdr.yml
  tags: [herdr]

# ── 7. herdr-flock plugin (local_ai only, by default) ───────────────────────
# Pixel-art agent visualizer. Scoped to the cockpit deliberately: it renders the
# LOCAL host's agents, and needs a Rust toolchain to build, so putting it on
# headless workers costs a toolchain to draw for nobody. Pinned to a reviewed
# commit — the upstream repo has no tags, releases, or LICENSE.
# Widen with:  -e flock_hosts=aorus_ai      Skip with:  --skip-tags flock
- import_playbook: provision-herdr-flock.yml
  tags: [flock]

# ── 8. Claude OAuth token (aorus_ai) ────────────────────────────────────────
# Re-asserts the long-lived token on every fleet host. This is the step that
# retires the auth countdown rather than monitoring it: a per-host claude login
# cannot be driven remotely at all (random loopback port, and the URL never
# reaches a pipe), while the refresh token expires ~30 days from the original
# interactive login and is NOT extended by use. A one-year minted token,
# re-asserted here, is the only path that does not eventually require sitting
# at each machine.
# Needs CLAUDE_CODE_OAUTH_TOKEN in ~/.claude/.env on the control node; the run
# fails loudly if it is absent rather than installing an empty export.
# Skip with:  ansible-playbook update.yml --skip-tags claude-token
- import_playbook: deploy-claude-token.yml
  tags: [claude-token]

# ── 9. Fleet observability (ai_all + observability_ai) ──────────────────────
# Converges node_exporter and the listening-port collector on every host, then
# renders the grafana/prometheus/loki stack on the observability_ai host. All
# versions, ports, images and retention windows come from observability.yml.
#
# Placement is inventory membership, deliberately: there is no local
# `setup.sh grafana`, because unconstrained targeting is what once installed the
# 9router gateway on every fleet host.
#
# The takeover of the existing recon stack is a third play carrying ansible's
# `never` tag, so nothing here can reach it. It restarts a live stack on a host
# that also runs 18 stubhub-minter containers, so it must be asked for by name:
#   ansible-playbook deploy-observability.yml --tags migrate
#
# Skip with:  ansible-playbook update.yml --skip-tags observability
- import_playbook: deploy-observability.yml
  tags: [observability]

# ── 10. Asset health (ai_all) ───────────────────────────────────────────────
# LAST on purpose: it reports the state every play above just produced, so a
# CLI installed in step 3 or a token asserted in step 8 is already in place
# when it probes. Runs scripts/preflight.sh — MCP servers, mandated CLIs,
# plugin health, env-var services, hooks and repo skills — which until now
# only ever ran on the control node.
# Read-only; never quarantines, and never fails the run.
# Skip with:  ansible-playbook update.yml --skip-tags preflight
- import_playbook: check-fleet-preflight.yml
  tags: [preflight]
