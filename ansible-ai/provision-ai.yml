---
# Makes the `<host>-claude` SSH aliases fully functional on every aorus box.
#
# Stage A — runtime (so the alias's RemoteCommand works at all):
#   - ~/Documents/Projects exists
#   - tmux installed (session persistence)
#   - Claude Code BINARY at ~/.local/bin/claude (native installer)
#
# Stage B — config (so remote claude behaves like your local setup):
#   - base deps (git/jq/curl) so setup.sh needn't sudo mid-run
#   - clone joggerjoel/ai-dotfiles
#   - run setup.sh UNATTENDED with the dotfiles_profile answer + core plugin
#     stack (defaults to 2/vps for the headless fleet; pass 1 for an
#     interactive Mac. Answers seeded: profile, github user, hide-AI=y; EOF
#      rest to safe defaults: skip MCP integrations, skip Supabase, install
#      core plugins, skip optional plugin groups)
#
# Idempotent: re-running skips anything already in place.
# Offline hosts (aorus2/aorus3 when down) are reported unreachable and skipped.
- name: Provision aorus hosts for the *-claude SSH aliases
  hosts: aorus_ai
  gather_facts: true
  ignore_unreachable: true
  vars:
    # Retry transient network/CDN errors (5xx, 429, timeouts, conn refused) so a
    # blip like a 503 from an install CDN doesn't hard-fail a whole host.
    curl_retry: "--retry 5 --retry-delay 2 --retry-connrefused"

    # The raw answer setup.sh's profile menu reads: an interactive Mac wants the
    # desktop profile, a headless box wants vps. The fleet is headless, hence "2".
    dotfiles_profile: "2"

    # ~/.claude/settings.json also appears on hosts where Claude Code ran before
    # ai-dotfiles was ever installed, so its presence is not proof setup.sh ran.
    # Set true to run setup anyway on such a host.
    dotfiles_force_setup: false
  tasks:
    # ── Stage 0: prerequisites ───────────────────────────────────────
    # Every CLI installer below pipes `curl`, and setup.sh needs git/jq. Install
    # (or confirm) these FIRST, then fail the host fast with a clear message so we
    # never attempt a doomed curl-based install on a box that lacks curl.
    # apt + sudo only apply to the Debian/Ubuntu fleet. macOS hosts get these
    # from Homebrew already; the gate task below verifies they're present.
    # pipx is headroom's installer (python CLI, isolated venv per package).
    - name: Install prerequisite packages (curl, git, jq, unzip, ca-certificates, pipx)
      become: true
      ansible.builtin.package:
        name: [curl, git, jq, unzip, ca-certificates, tar, gzip, pipx]
        state: present
      failed_when: false # a pkg-mgr hiccup shouldn't abort; the gate below decides
      register: prereqs
      when: ansible_facts.os_family == "Debian"

    - name: Check the hard prerequisites are present
      ansible.builtin.shell: "command -v curl >/dev/null && command -v git >/dev/null"
      args:
        executable: /bin/bash
      register: prereq_check
      changed_when: false
      failed_when: false

    - name: Fail fast when prerequisites are missing
      ansible.builtin.fail:
        msg: >-
          Missing required tools on {{ inventory_hostname }} (need curl and git).
          Package install did not provide them — check the host's package manager
          and sudo access, then re-run. Skipping all installs for this host.
      when: prereq_check.rc != 0

    # Node.js runtime for Gemini CLI (npm-only, needs node >=20). Not an OS
    # package, so bootstrap nvm + Node LTS here — as part of the deploy — when no
    # runtime is present. Idempotent: skipped when node already resolves.
    - name: Is a Node.js runtime available (system or nvm)?
      ansible.builtin.shell: |
        command -v node >/dev/null 2>&1 && exit 0
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        command -v node >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: node_check
      changed_when: false
      failed_when: false

    - name: Install nvm (when no Node.js runtime present)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.5/install.sh | bash
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
      when: node_check.rc != 0

    - name: Install Node.js LTS via nvm (when no Node.js runtime present)
      ansible.builtin.shell: |
        set -o pipefail
        export NVM_DIR="$HOME/.nvm"
        . "$NVM_DIR/nvm.sh"
        nvm install --lts
        nvm alias default 'lts/*'
      args:
        executable: /bin/bash
      when: node_check.rc != 0

    # ── Stage A: runtime ─────────────────────────────────────────────
    - name: Detect existing tmux
      ansible.builtin.shell: command -v tmux
      register: tmux_check
      changed_when: false
      failed_when: false

    - name: Install tmux (only when missing; requires sudo)
      become: true
      ansible.builtin.package:
        name: tmux
        state: present
      when: tmux_check.rc != 0 and ansible_facts.os_family == "Debian"

    - name: Ensure ~/Documents/Projects exists
      ansible.builtin.file:
        path: "{{ projects_dir }}"
        state: directory
        mode: "0755"

    - name: Check for the Claude Code binary
      ansible.builtin.stat:
        path: "{{ claude_bin }}"
      register: claude_stat

    - name: Install Claude Code binary (native installer -> ~/.local/bin)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://claude.ai/install.sh | bash
      args:
        executable: /bin/bash
        creates: "{{ claude_bin }}"
      when: not claude_stat.stat.exists

    # ── Sibling agent CLIs (share ~/.claude/CLAUDE.md via AGENTS.md symlink,
    #    which setup.sh creates in Stage B) ────────────────────────────
    - name: Install Codex CLI (standalone installer -> ~/.local/bin/codex)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/codex"

    - name: Install Cursor CLI (official installer -> ~/.local/bin/cursor-agent)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://cursor.com/install | bash
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/cursor-agent"

    - name: Install Cortex Code CLI (Snowflake installer -> ~/.local/bin/cortex)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://ai.snowflake.com/static/cc-scripts/install.sh | NON_INTERACTIVE=1 SKIP_PATH_PROMPT=1 sh
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/cortex"

    - name: Is opencode present? (installer dir varies)
      ansible.builtin.shell: |
        for p in "$HOME/.opencode/bin/opencode" "$HOME/.local/bin/opencode"; do
          [ -x "$p" ] && exit 0
        done
        command -v opencode >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: opencode_check
      changed_when: false
      failed_when: false

    - name: Install opencode (standalone installer)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://opencode.ai/install | bash
      args:
        executable: /bin/bash
      when: opencode_check.rc != 0

    - name: Is the Gemini CLI present? (npm global lives under nvm)
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        command -v gemini
      args:
        executable: /bin/bash
      register: gemini_check
      changed_when: false
      failed_when: false

    - name: Install Gemini CLI (npm global, via nvm)
      ansible.builtin.shell: |
        set -o pipefail
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        npm install -g @google/gemini-cli
      args:
        executable: /bin/bash
      when: gemini_check.rc != 0

    # pi (Earendil Pi coding agent) — npm global; a firstmate co-primary harness.
    - name: Is the Pi CLI present? (npm global lives under nvm)
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        command -v pi
      args:
        executable: /bin/bash
      register: pi_check
      changed_when: false
      failed_when: false

    - name: Install Pi CLI (npm global, via nvm; vendor documents --ignore-scripts)
      ansible.builtin.shell: |
        set -o pipefail
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      args:
        executable: /bin/bash
      when: pi_check.rc != 0

    # grok (official xAI Grok CLI) — npm global; a firstmate co-primary harness.
    # @xai-official/grok is the package firstmate targets; third-party grok-cli
    # packages are NOT interchangeable.
    - name: Is the Grok CLI present? (npm global lives under nvm)
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        command -v grok
      args:
        executable: /bin/bash
      register: grok_check
      changed_when: false
      failed_when: false

    - name: Install Grok CLI (npm global, via nvm)
      ansible.builtin.shell: |
        set -o pipefail
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        npm install -g @xai-official/grok
      args:
        executable: /bin/bash
      when: grok_check.rc != 0

    # headroom (context-optimization proxy the CLIs can route through).
    # pipx- or uv-managed: Debian's pipx package isn't reliably available
    # (the Stage 0 install is best-effort), so fall back to `uv tool` and
    # bootstrap uv itself when neither manager exists. Both are resolved
    # by absolute path — Ansible shells are non-login, so brew's bin dir
    # and ~/.local/bin may be off PATH. agents-update.sh upgrades along
    # the same pipx-or-uv split.
    - name: Install Headroom (pipx or uv tool -> ~/.local/bin/headroom)
      ansible.builtin.shell: |
        set -o pipefail
        resolve() {
          command -v "$1" 2>/dev/null && return
          for d in /opt/homebrew/bin /usr/local/bin "$HOME/.local/bin" "$HOME/.cargo/bin"; do
            [ -x "$d/$1" ] && { echo "$d/$1"; return; }
          done
        }
        PIPX="$(resolve pipx)"; UV="$(resolve uv)"
        if [ -z "$PIPX" ] && [ -z "$UV" ]; then
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          UV="$(resolve uv)"
        fi
        # pipx ≥1.8 may shell out to uv (searched on PATH); without uv,
        # force the pip backend so a bare pipx still works.
        if [ -n "$UV" ]; then PATH="$(dirname "$UV"):$PATH"; else export PIPX_DEFAULT_BACKEND=pip; fi
        if [ -n "$PIPX" ]; then "$PIPX" install 'headroom-ai[all]'
        elif [ -n "$UV" ]; then "$UV" tool install 'headroom-ai[all]'
        else echo "pipx/uv not available — headroom skipped"; exit 0
        fi
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/headroom"

    # gh + bun. setup.sh installs both (ensure_gh/ensure_bun) but only runs on a
    # host that reaches Stage B, so a host provisioned by this playbook alone was
    # left without them. Both installs land in $HOME, matching setup.sh, so the
    # two paths converge on the same binaries.
    #
    # gh: setup.sh's no-sudo release-tarball fallback (gh_install_binary), not its
    # apt-keyring branch — one branch covers Debian and macOS, needs no root, and
    # puts gh in ~/.local/bin alongside every other CLI here. The apt branch would
    # need a second macOS-only brew branch and root on every Debian box.
    # Detection probes absolute paths as well as PATH: Ansible shells are
    # non-login, so a brew- or apt-installed gh may not be on PATH.
    - name: Is gh present? (PATH varies; may be brew, apt, or ~/.local/bin)
      ansible.builtin.shell: |
        for p in "$HOME/.local/bin/gh" /opt/homebrew/bin/gh /usr/local/bin/gh /usr/bin/gh; do
          [ -x "$p" ] && exit 0
        done
        command -v gh >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: gh_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install gh (release tarball -> ~/.local/bin/gh)
      ansible.builtin.shell: |
        set -o pipefail
        case "$(uname -m)" in
          x86_64)        arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)             arch=amd64 ;;
        esac
        # cli/cli publishes Linux as .tar.gz but macOS only as .zip. The hardcoded
        # .tar.gz URL in setup.sh would 404 here; it never runs on a Mac (the brew
        # branch wins), so the bug stayed hidden there.
        os=linux; ext=tar.gz
        [ "$(uname -s)" = "Darwin" ] && { os=macOS; ext=zip; }
        tag=$(curl {{ curl_retry }} -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r '.tag_name')
        [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "could not resolve latest gh release"; exit 1; }
        ver="${tag#v}"
        # A predictable /tmp name is clobberable by any other user on the box;
        # setup.sh uses one, an unattended fleet run should not.
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl {{ curl_retry }} -fsSL \
          "https://github.com/cli/cli/releases/download/${tag}/gh_${ver}_${os}_${arch}.${ext}" -o "$tmp/gh.${ext}"
        case "$ext" in
          tar.gz) tar xzf "$tmp/gh.${ext}" -C "$tmp" ;;
          zip)    unzip -q "$tmp/gh.${ext}" -d "$tmp" ;;
        esac
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmp/gh_${ver}_${os}_${arch}/bin/gh" "$HOME/.local/bin/gh"
      args:
        executable: /bin/bash
        # `when` alone is the real guard (gh may live outside ~/.local/bin);
        # creates: additionally lets --check report this task truthfully — a
        # shell task without it is skipped outright in check mode.
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/gh"
      when: gh_check.rc != 0

    - name: Is bun present? (installer dir ~/.bun/bin, or brew)
      ansible.builtin.shell: |
        for p in "$HOME/.bun/bin/bun" "$HOME/.local/bin/bun" /opt/homebrew/bin/bun /usr/local/bin/bun; do
          [ -x "$p" ] && exit 0
        done
        command -v bun >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: bun_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install bun (official installer -> ~/.bun/bin/bun)
      ansible.builtin.shell: |
        set -o pipefail
        curl {{ curl_retry }} -fsSL https://bun.sh/install | bash
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts.env.HOME }}/.bun/bin/bun"
      when: bun_check.rc != 0

    # ── Stage B: ai-dotfiles config (vps profile) ────────────────
    # (git/jq/curl already ensured in Stage 0)
    # force: true discards local runtime pollution — the live ~/.claude/settings.json
    # symlinks into profiles/*/settings.json, so Claude writing enabledPlugins there
    # dirties this tree. The fleet checkout is a deploy mirror of origin, so reset it.
    - name: Clone/update ai-dotfiles
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ dotfiles_dir }}"
        version: main
        update: true
        force: true
      when: install_dotfiles | bool

    - name: Has ai-dotfiles already been set up on this host?
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.claude/settings.json"
      register: dotfiles_done
      when: install_dotfiles | bool

    - name: Run ai-dotfiles setup.sh (profile answer {{ dotfiles_profile }}, unattended)
      ansible.builtin.shell: |
        printf '{{ dotfiles_profile }}\n{{ dotfiles_github_user }}\n{{ dotfiles_hide_ai }}\n' | bash setup.sh
      args:
        chdir: "{{ dotfiles_dir }}"
        executable: /bin/bash
      register: dotfiles_setup
      changed_when: "'Setup complete' in dotfiles_setup.stdout"
      when:
        - install_dotfiles | bool
        - not (dotfiles_done.stat.exists | default(false)) or (dotfiles_force_setup | bool)

    # ── Verify + report ──────────────────────────────────────────────
    - name: Verify claude
      ansible.builtin.command: "{{ claude_bin }} --version"
      register: claude_ver
      changed_when: false
      failed_when: false

    - name: Verify sibling agent CLIs
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        oc=MISSING
        for p in "$HOME/.opencode/bin/opencode" "$HOME/.local/bin/opencode"; do
          [ -x "$p" ] && { oc=present; break; }
        done
        printf 'codex=%s cursor=%s cortex=%s opencode=%s gemini=%s pi=%s grok=%s headroom=%s' \
          "$([ -x "$HOME/.local/bin/codex" ] && echo present || echo MISSING)" \
          "$([ -x "$HOME/.local/bin/cursor-agent" ] && echo present || echo MISSING)" \
          "$([ -x "$HOME/.local/bin/cortex" ] && echo present || echo MISSING)" \
          "$oc" \
          "$(command -v gemini >/dev/null 2>&1 && echo present || echo MISSING)" \
          "$(command -v pi >/dev/null 2>&1 && echo present || echo MISSING)" \
          "$(command -v grok >/dev/null 2>&1 && echo present || echo MISSING)" \
          "$([ -x "$HOME/.local/bin/headroom" ] && echo present || echo MISSING)"
      args:
        executable: /bin/bash
      register: sibling_clis
      changed_when: false
      failed_when: false

    - name: Report per-host result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ->
          tmux: {{ 'present' if tmux_check.rc == 0 else ('installed' if ansible_facts.os_family == 'Debian' else 'MISSING (non-Debian — install manually)') }} |
          claude: {{ claude_ver.stdout | default('MISSING', true) }} |
          {{ sibling_clis.stdout | default('codex=? cursor=?', true) }} |
          dotfiles: {{ 'configured' if (install_dotfiles | bool) else 'skipped' }}

# ── Claude OAuth token ───────────────────────────────────────────────────────
# A freshly provisioned host has the claude BINARY but no credential, and it
# cannot get one on its own: claude's login binds a random loopback port on the
# machine running it, so a browser anywhere else cannot complete it. Without
# this step a new worker is installed and unauthenticated, and the only fix is
# physically sitting at it.
# Needs CLAUDE_CODE_OAUTH_TOKEN in ~/.claude/.env on the control node.
# Skip with:  ansible-playbook provision-ai.yml --skip-tags claude-token
- import_playbook: deploy-claude-token.yml
  tags: [claude-token]
