---
- name: Deploy the Herdr supervisor shell command
  hosts: ai_all
  gather_facts: true
  ignore_unreachable: true
  tasks:
    - ansible.builtin.import_tasks: tasks/end-unreachable-hosts.yml
      vars:
        unreachable_note: "Herdr shell command was not updated"

    - name: Require an existing zsh module registry
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/zsh/modules.conf"
      register: shell_registry

    - ansible.builtin.assert:
        that: shell_registry.stat.isreg | default(false)
        fail_msg: "Install ai-dotfiles with its zsh registry before deploying this module"

    - name: Back up shell configuration
      ansible.builtin.shell: |
        set -eu
        backup_dir="$HOME/.claude/.backups/herdr-shell"
        mkdir -p "$backup_dir"
        for config in "$HOME/.zshrc" "$DOTFILES_CHECKOUT/zsh/modules.conf" "$DOTFILES_CHECKOUT/zsh/modules/herdr-orchestrator.zsh"; do
          if [ -e "$config" ]; then
            cp -L "$config" "$backup_dir/$(basename "$config").$(date +%Y%m%d_%H%M%S)"
            printf '%s | %s | deploy herdr-master shell command\n' "$(date '+%Y-%m-%d %H:%M')" "$config" >> "$HOME/.claude/.backups/CHANGELOG.md"
          fi
        done
      args:
        executable: /bin/bash
      environment:
        DOTFILES_CHECKOUT: "{{ dotfiles_dir }}"
      changed_when: false

    - name: Deploy only the supervisor shell module
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../zsh/modules/herdr-orchestrator.zsh"
        dest: "{{ dotfiles_dir }}/zsh/modules/herdr-orchestrator.zsh"
        mode: '0644'

    - name: Register the supervisor command on both platforms
      ansible.builtin.lineinfile:
        path: "{{ dotfiles_dir }}/zsh/modules.conf"
        regexp: '^[0-9]+\|herdr-orchestrator\|'
        line: '88|herdr-orchestrator|both|-|-'
        insertbefore: '^90\|completions\|'

    - name: Apply the shared zsh registry
      ansible.builtin.command: bash setup.sh zsh
      args:
        chdir: "{{ dotfiles_dir }}"
      async: 110
      poll: 5

    - name: Verify generated shell configuration loads the module
      ansible.builtin.shell: |
        set -eu
        zsh -n "$HOME/.zshrc"
        grep -F '/zsh/modules/herdr-orchestrator.zsh' "$HOME/.zshrc"
        zsh -fc 'source "$1/zsh/modules/herdr-orchestrator.zsh"; whence -w herdr-master' -- "$DOTFILES_CHECKOUT"
        if [ -x "$HOME/Developer/herdr-orchestrator/herdr-master" ]; then
          echo 'orchestrator default checkout: present'
        else
          echo 'orchestrator default checkout: absent; configure HERDR_ORCHESTRATOR_DIR before use'
        fi
      args:
        executable: /bin/bash
      environment:
        DOTFILES_CHECKOUT: "{{ dotfiles_dir }}"
      changed_when: false
      register: shell_check

    - ansible.builtin.debug:
        var: shell_check.stdout_lines
