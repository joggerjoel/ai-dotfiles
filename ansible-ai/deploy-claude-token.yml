---
# Distribute the long-lived Claude Code OAuth token to the fleet.
#
# Why this exists at all, rather than a `just auth-login claude` that drives a
# flow per host: claude's login binds a RANDOM loopback port on the machine
# running it and never prints its URL to a pipe, so a browser on the Mac cannot
# reach a listener on aorus4 and the URL cannot even be scraped to tunnel it.
# Per-host login is not inconvenient, it is impossible. Measured 2026-08-11 —
# see ~/Developer/herdr (references/herdr-auth.md moved there).
#
# And why it belongs in the UPDATE path, not only in provisioning: the refresh
# token runs ~30 days from the original interactive login and is NOT extended by
# use (four hosts refreshed in the same second held four different windows). So
# every host counts down to a login nobody can perform remotely. `setup-token`
# mints a ONE-YEAR credential with no refresh dependency, and re-asserting it on
# each `./update.sh --all` retires the countdown instead of monitoring it.
#
#   Normal use:      just claude-token [host...]      # prompts if needed
#   Dry run first:   just claude-token-check [host...]
#   Skip in update:  ansible-playbook update.yml --skip-tags claude-token
#
# ── Getting the token in place ────────────────────────────────────────────────
# Use `just claude-token`. It prompts without echo, proves the token
# authenticates BEFORE writing anything, and stores it 0600 in ~/.claude/.env
# (already gitignored) — all in one process.
#
# Do NOT hand-assemble it across two commands. This did not work:
#
#     read -rs TOKEN                                    # one shell
#     printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$TOKEN" \  # ...another
#       >> ~/.claude/.env
#
# $TOKEN was empty in the second shell, so the file got
# `CLAUDE_CODE_OAUTH_TOKEN=` with no value — a line that satisfies every
# "is the token set?" grep and authenticates nothing. The assert in the shared
# task file is what caught it. scripts/claude-token.sh reads and writes in the
# same process for exactly this reason, and refuses an empty value.
#
# Nothing downstream ever prints the value: every task that touches it sets
# no_log.
#
# ── Where the work lives ──────────────────────────────────────────────────────
# tasks/fleet-env-secret.yml. It resolves the value, proves it authenticates on
# the control node, writes ~/.config/claude-fleet/env 0600 and sources that file
# from the login rc above the interactive guard. provision-firecrawl.yml
# includes the same file for FIRECRAWL_API_KEY, so both land in one file behind
# one rc stanza. Read its header before changing anything here.
#
# ── Scope ─────────────────────────────────────────────────────────────────────
# aorus_ai, NOT ai_all. The control node is where the token is MINTED and where
# claude logs in normally through its own loopback flow; pushing an env var
# there would shadow a working credential with a copy of itself. (deploy-9router
# learned this the expensive way by targeting too broadly — aorus8, 2026-07-19.)
- name: Distribute the Claude Code OAuth token
  hosts: aorus_ai
  gather_facts: true
  ignore_unreachable: true

  tasks:
    - ansible.builtin.import_tasks: tasks/end-unreachable-hosts.yml
      vars: { unreachable_note: "no token written" }

    # The account list is not a secret. Same precedence as the secrets: an
    # exported CLAUDE_ACCOUNTS wins over the control node's ~/.claude/.env.
    # Empty means the single un-named token below, exactly as before accounts
    # existed.
    - name: Resolve the Claude account list
      ansible.builtin.set_fact:
        claude_accounts: >-
          {{ (lookup('env', 'CLAUDE_ACCOUNTS') | default('', true) | trim
              if (lookup('env', 'CLAUDE_ACCOUNTS') | default('', true) | trim | length > 0)
              else ((lookup('file', lookup('env', 'HOME') ~ '/.claude/.env', errors='ignore') | default('', true))
                    | regex_findall('(?m)^[ \t]*(?:export[ \t]+)?CLAUDE_ACCOUNTS[ \t]*=[ \t]*["\x27]?([^"\x27\r\n]+)')
                    | first | default('', true) | trim))
             | regex_findall('[a-z0-9_]+') }}

    # CLAUDE_CODE_OAUTH_TOKEN is always exported, so a plain `claude` works with
    # no wrapper. With accounts, its value is the FIRST account's token.
    - ansible.builtin.include_tasks: tasks/fleet-env-secret.yml
      vars:
        secret_var: CLAUDE_CODE_OAUTH_TOKEN
        secret_from: "{{ ('CLAUDE_CODE_OAUTH_TOKEN_' ~ (claude_accounts[0] | upper)) if claude_accounts | length > 0 else '' }}"
        secret_probe: "claude -p 'reply with just ok'"
        secret_hint: >-
          Mint one with `claude setup-token` on the control node and append it
          to ~/.claude/.env as CLAUDE_CODE_OAUTH_TOKEN=<token>. With accounts
          configured, the first account's token is used instead; to name an
          existing token run `just claude-token --account NAME --from-primary`.
          See the header of this playbook.
        secret_done_hint: >-
          Confirm with `just auth-status`: hosts on the fleet token report `token`.

    # One export per account, then the ordered list bin/claude-acct reads.
    - ansible.builtin.include_tasks: tasks/fleet-env-secret.yml
      loop: "{{ claude_accounts }}"
      vars:
        secret_var: "CLAUDE_CODE_OAUTH_TOKEN_{{ item | upper }}"
        # The candidate arrives under its account name; claude only reads the
        # plain one, so move it there or the probe would test the control
        # node's own login instead of this token. `export` keeps it out of argv.
        secret_probe: >-
          export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN_{{ item | upper }}";
          claude -p 'reply with just ok'
        secret_hint: >-
          Run `just claude-token --account {{ item }}` to mint and store it.
        secret_done_hint: >-
          Account {{ item }} is available to bin/claude-acct on every host.

    - ansible.builtin.include_tasks: tasks/fleet-env-secret.yml
      when: claude_accounts | length > 0
      vars:
        secret_var: CLAUDE_ACCOUNTS
        secret_probe: "true"
        secret_hint: Set by `just claude-token --account NAME`.
        secret_done_hint: >-
          Cron jobs switch accounts with `claude-acct -p ...`; see
          guides/claude-accounts.md.
