[defaults]
# Real hosts live in the gitignored local inventory (copy from inventory.example.yml).
inventory = inventory.local.yml
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
# YAML-formatted task results. The old `stdout_callback = yaml` resolved to
# community.general.yaml, removed in community.general 12.0.0. The built-in
# `default` callback covers this via callback_result_format (ansible-core 2.13+).
callback_result_format = yaml

[ssh_connection]
pipelining = True
